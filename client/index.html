    <!-- ── Boot splash ───────────────────────────────────────────────────────────
         Inline on purpose: this paints from the first byte, before the bundle, the
         stylesheet or a single font has arrived. Without it the app opens on a bare
         dark rectangle for as long as the network takes — worst on the phones and
         PWA/webview launches this game is mostly played on. Removed by main.tsx once
         React has mounted; see #splash there. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(120% 90% at 50% 18%, #1A140E 0%, #0E0B08 62%);
        opacity: 1; transition: opacity .32s ease;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .sp-mark { width: min(38vw, 168px); aspect-ratio: 1; animation: sp-breathe 2.6s ease-in-out infinite; }
      #splash .sp-mark img { width: 100%; height: 100%; object-fit: contain; }
      #splash .sp-word {
        font: 700 clamp(26px, 7vw, 40px)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: .34em; text-indent: .34em; color: #F3E9D6;
      }
      /* A real progress bar, pinned to the bottom of the screen: the art is fetched up front and
         cached, so there IS a number to show and an indeterminate sweep would be a lie. It starts
         as a sweep and switches to a fill the moment the loader reports its first figure. */
      #splash .sp-foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
      #splash .sp-pct { font: 700 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .08em; color: #F3E9D6;
        text-shadow: 0 2px 6px rgba(0,0,0,.8); padding-bottom: 7px; opacity: 0; transition: opacity .2s; }
      #splash[data-loading] .sp-pct { opacity: 1; }
      #splash .sp-bar { width: 100%; height: 10px; border-radius: 0; background: rgba(0,0,0,.55); overflow: hidden; }
      #splash .sp-bar i { display: block; width: 40%; height: 100%; background: linear-gradient(180deg, #F2803A, #E5661A);
        animation: sp-slide 1.15s ease-in-out infinite; }
      /* data-loading is set once the loader knows the total; from then on the width IS the truth. */
      #splash[data-loading] .sp-bar i { animation: none; transform: none; width: var(--sp, 0%); transition: width .18s ease-out; }
      @keyframes sp-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
      @keyframes sp-slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(355%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-mark, #splash .sp-bar i { animation: none; }
        #splash .sp-bar i { width: 100%; }
      }
    </style>
    <!-- No JavaScript means nothing will ever take the splash down, and it would bury the
         <noscript> copy below. Hide it up front in that case. -->
    <noscript><style>#splash { display: none !important; }</style></noscript>
  </head>
